<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Litara · Reading Room · title layout studies</title>
<style>
@font-face{font-family:Fraunces;src:url(../../apps/web/node_modules/@fontsource-variable/fraunces/files/fraunces-latin-wght-normal.woff2);font-weight:100 900}
@font-face{font-family:Fraunces;font-style:italic;src:url(../../apps/web/node_modules/@fontsource-variable/fraunces/files/fraunces-latin-wght-italic.woff2);font-weight:100 900}
@font-face{font-family:"IM Fell";src:url(../../apps/web/node_modules/@fontsource/im-fell-english/files/im-fell-english-latin-400-normal.woff2)}
@font-face{font-family:"IM Fell";font-style:italic;src:url(../../apps/web/node_modules/@fontsource/im-fell-english/files/im-fell-english-latin-400-italic.woff2)}
@font-face{font-family:"Source Sans";src:url(../../apps/web/node_modules/@fontsource-variable/source-sans-3/files/source-sans-3-latin-wght-normal.woff2);font-weight:200 900}
:root{--paper:#fbf6ea;--paper2:#f4ebd6;--desk:#eee2c8;--pline:#d6c7a4;--pink:#2a2018;--pdim:#65553f;--pedge:#85704f;--pri:#1f4f82;--priInk:#fff8e6;--priSoft:#dde6ef;--ribbon:#a8322b;
 --lea:#3a2a20;--lea2:#271b14;--lea3:#1b120d;--lInk:#f3e8cf;--lDim:#cdbb94;--foil:#dcb85f;--foil2:#a8873a;--ok:#8ad09a;--aud:#c4a3e0;
 --display:Fraunces,Georgia,serif;--sans:"Source Sans",system-ui,sans-serif;--accent:"IM Fell",Georgia,serif}
*{box-sizing:border-box}
body{margin:0;background:var(--desk);color:var(--pink);font:15px/1.45 var(--sans)}
.wrap{max-width:1240px;margin:0 auto;padding:22px 20px 80px}
h1{font:700 30px var(--display);margin:0 0 4px}.lede{color:var(--pdim);margin:0 0 14px;max-width:820px}
h2{font:700 21px var(--display);margin:34px 0 4px}.sub{color:var(--pdim);margin:0 0 10px;font-size:14px;max-width:900px}
.legend{display:flex;flex-wrap:wrap;gap:16px;font-size:13px;color:var(--pdim);margin:8px 0 6px}
svg.i{width:1.15em;height:1.15em;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
.fit{width:100%;overflow:hidden;border:2px solid var(--pedge);border-radius:4px;box-shadow:3px 3px 0 var(--pline);margin-top:8px}
.stage{width:1400px;transform-origin:0 0}
/* ---------- shared pieces ---------- */
.cv{position:relative;aspect-ratio:2/3;border-radius:2px 5px 5px 2px;overflow:hidden;color:#fff;display:flex;flex-direction:column;justify-content:space-between;padding:9% 10% 9% 14%;container-type:inline-size;
 background:linear-gradient(155deg,hsl(var(--h) 52% 38%),hsl(calc(var(--h) + 35) 58% 18%));box-shadow:1px 2px 3px rgba(0,0,0,.35),3px 0 0 -1px #f7f0dc,4px 0 0 -1px #cdbf9c;font-family:var(--display)}
.cv::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(115deg,rgba(255,255,255,.05) 0 2px,transparent 2px 9px)}
.cv::after{content:"";position:absolute;left:0;top:0;bottom:0;width:9%;background:linear-gradient(90deg,rgba(0,0,0,.35),rgba(255,255,255,.14) 55%,rgba(0,0,0,.18))}
.cv b{position:relative;font-size:13cqw;line-height:1.05;font-weight:650}.cv i{position:relative;font-style:normal;font-size:7.5cqw;text-transform:uppercase;letter-spacing:.12em;opacity:.9}
.tag{display:inline-block;font:700 10px/1 var(--sans);letter-spacing:.06em;padding:3px 5px;border-radius:2px;background:rgba(20,12,6,.78);color:#f6ecd2;border:1px solid rgba(220,184,95,.6)}
.tag.au{background:rgba(70,36,96,.85);color:#f1e3fa;border-color:rgba(196,163,224,.7)}
.cvwrap{position:relative}.cvwrap .fm{position:absolute;top:7px;right:7px;display:flex;flex-direction:column;gap:3px;align-items:flex-end}
/* hover-only menu dots (applies to every cover) */
.cvwrap .more{position:absolute;right:8px;bottom:8px;width:28px;height:28px;border-radius:50%;border:1px solid rgba(220,184,95,.7);background:rgba(20,12,6,.72);color:#f6ecd2;display:grid;place-items:center;opacity:0;transition:opacity .15s}
.cvwrap:hover .more{opacity:1}
.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--pedge);background:var(--paper);color:var(--pink);border-radius:3px;padding:6px 13px;font:600 14px var(--sans);white-space:nowrap}
.btn.pri{background:var(--pri);color:var(--priInk);border-color:#16385e}
.btn.ico{padding:6px 8px}
.btn.sm{padding:3px 9px;font-size:13px}
.stars{display:inline-flex;gap:2px;color:var(--foil)}.stars svg{width:17px;height:17px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.kvl{display:flex;justify-content:space-between;gap:12px;padding:5px 0;border-bottom:1px solid var(--line,#0003)}
.kvl span:first-child{color:var(--dm,#888)}.kvl .tag{color:#f6ecd2}.kvl .tag.au{color:#f1e3fa}.kvl span:last-child{text-align:right;font-weight:600}
.ed{display:inline-flex;gap:3px;color:var(--dm);cursor:pointer}
.chips{display:flex;gap:6px;flex-wrap:wrap}.chip{border:1px solid var(--foil2);border-radius:999px;padding:1px 10px;font-size:12px}
.quote{font:16px/1.5 var(--display)}
.rail{display:flex;gap:14px;overflow:hidden}.rail .cvwrap{width:106px;flex:none}
.tabsx{display:flex;gap:2px;font-weight:600;font-size:14px}.tabsx a{padding:9px 14px;display:flex;gap:6px;align-items:center}

body{background:#ede9df}.switch{display:flex;flex-wrap:wrap;gap:6px;padding:12px max(3vw,16px);background:#242321;color:white;align-items:center}.switch strong{margin-right:auto;font:20px Georgia}.switch button{font:inherit;border:1px solid #68655d;background:transparent;color:inherit;padding:6px 12px;border-radius:4px;cursor:pointer}.switch [aria-pressed=true]{background:#faf2dc;color:#28231f}
main{max-width:1480px;margin:auto;padding:18px clamp(14px,3vw,52px) 36px;--dm:#625948;--line:#aa997766}.tools,.tools a,.nav{display:flex;gap:9px;align-items:center}.tools{flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:12px;font-size:14px}.nav{margin-left:auto}.tools .on{font-weight:bold;text-decoration:underline;text-underline-offset:4px}
.layout{display:grid;gap:20px;grid-template-columns:minmax(230px,1fr) minmax(280px,1.65fr) minmax(230px,1fr);grid-template-areas:'hero hero hero' 'ed syn facts' 'log rev facts' 'hi rev facts';margin:18px 0}.hero{grid-area:hero;display:flex;align-items:center;gap:clamp(16px,3vw,48px);padding:24px;background:#61382a;color:#fff1d9;outline:1px dashed #d8ae81;outline-offset:-8px;background-image:repeating-linear-gradient(25deg,transparent 0 3px,#331b1417 4px)}.hero>.cvwrap{width:112px;flex:none}.hero h1{font:500 clamp(36px,4.8vw,76px)/1 var(--display);letter-spacing:-.045em}.by{margin:8px 0;font:italic 18px Georgia}.hero .row,.chips{margin-top:10px}.panel{min-width:0;align-self:start;border-top:2px solid currentColor;padding-top:8px}.panel h2,.shelf h2{font:600 21px var(--display);margin:0 0 8px}.panel small{float:right;font:13px var(--sans);color:var(--dm)}.syn{grid-area:syn}.facts{grid-area:facts}.rev{grid-area:rev}.log{grid-area:log}.hi{grid-area:hi}.editions{grid-area:ed}.shelf{border-top:1px solid var(--line);padding-top:14px}.rail{overflow:auto;padding-bottom:8px}.quote{line-height:1.55}.editions>.btn,.log>.btn{margin-top:8px}
body[data-v="1"]{background:#192a2b;color:#f7eacc}body[data-v="1"] main{--dm:#cdc1a3;--line:#ab9159}.v1 .layout{grid-template-areas:'hero syn facts' 'hero rev facts' 'hero log ed' 'hero hi ed'}.v1 .hero{display:flex;flex-direction:column;text-align:center;background:#122122;outline:3px double #ab9159;gap:16px;height:100%;justify-content:center}.v1 .hero h1{font-size:38px}.v1 .hero .row,.v1 .chips{justify-content:center}.v1 .panel{border-top:3px double #ab9159}.v1 .hero>.cvwrap{width:135px}
body[data-v="2"]{background:#fffdf6;color:#241e1a}.v2 .layout{grid-template-areas:'hero hero facts' 'syn syn facts' 'rev log ed' 'hi hi ed'}.v2 .hero{background:transparent;color:inherit;outline:none;border-block:4px double #27231c;padding:18px 0;flex-direction:row-reverse;justify-content:space-between}.v2 .hero h1{font:italic 700 clamp(42px,6vw,88px)/.96 Georgia}.v2 .by{color:#923222}.v2 .syn .quote{column-count:2;column-gap:28px}.v2 .syn .quote:first-letter{float:left;font:54px/.9 Georgia;margin-right:4px}
body[data-v="3"]{background:#e0e8df;color:#173f37}.v3 .layout{grid-template-areas:'hero facts syn' 'hero facts log' 'ed rev hi';gap:12px}.v3 .hero{flex-direction:column;align-items:flex-start;background:#204d43;outline:none;border-radius:12px 12px 0 0;gap:12px}.v3 .hero h1{font:bold 32px/1 var(--sans)}.v3 .hero>.cvwrap{width:74px}.v3 .panel{background:#fffdf2;padding:16px;height:100%;border-top:5px solid #849f88}.v3 .panel h2{font:700 17px var(--sans)}.v3 .facts .kvl{display:block;padding:3px 0}.v3 .facts .kvl>span:first-child{display:inline-block;min-width:48%;font:12px monospace}.v3 .syn{background:repeating-linear-gradient(#fffdf2 0 23px,#dce4db 24px)}.v3 .syn .quote{line-height:24px}
@media(max-width:850px){main .layout{grid-template-columns:1fr 1fr;grid-template-areas:'hero hero' 'syn facts' 'ed facts' 'log rev' 'hi hi'}.v1 .hero,.v3 .hero{flex-direction:row;text-align:left}.v2 .syn .quote{column-count:1}}
@media(max-width:580px){main .layout{display:flex;flex-direction:column}.panel{width:100%}.hero,.v1 .hero,.v2 .hero,.v3 .hero{align-items:flex-start;flex-direction:column}.hero>.cvwrap,.v1 .hero>.cvwrap{width:80px}.switch strong{width:100%}.tools{gap:8px}.v3 .panel{height:auto}}
</style></head><body>
<svg width="0" height="0" style="position:absolute"><defs>
<symbol id="arrow-left" viewBox="0 0 24 24"><path d="M19 12H5M11 6l-6 6 6 6"/></symbol>
<symbol id="chev-l" viewBox="0 0 24 24"><path d="m15 5-7 7 7 7"/></symbol><symbol id="chev-r" viewBox="0 0 24 24"><path d="m9 5 7 7-7 7"/></symbol>
<symbol id="book-open" viewBox="0 0 24 24"><path d="M12 7c-2-1.5-5-2-8-1.5v13c3-.5 6 0 8 1.5 2-1.5 5-2 8-1.5v-13c-3-.5-6 0-8 1.5zM12 7v13"/></symbol>
<symbol id="headphones" viewBox="0 0 24 24"><path d="M4 15v-3a8 8 0 0 1 16 0v3"/><rect x="3" y="14" width="4" height="6" rx="1.5"/><rect x="17" y="14" width="4" height="6" rx="1.5"/></symbol>
<symbol id="download" viewBox="0 0 24 24"><path d="M12 4v11M7 11l5 5 5-5M5 20h14"/></symbol>
<symbol id="shelf" viewBox="0 0 24 24"><path d="M4 5h4v14H4zM10 5h4v14h-4zM16.5 6l3.5 1-3 12-3.5-1z"/></symbol>
<symbol id="send" viewBox="0 0 24 24"><path d="m21 3-9 18-2-8-8-2zM10 13l11-10"/></symbol>
<symbol id="eye" viewBox="0 0 24 24"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></symbol>
<symbol id="check" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="m8.5 12.3 2.5 2.5 4.5-5"/></symbol>
<symbol id="pencil" viewBox="0 0 24 24"><path d="M4 20l1-4L16.5 4.5a2 2 0 0 1 3 3L8 19z"/></symbol>
<symbol id="dots" viewBox="0 0 24 24"><circle cx="12" cy="5.5" r="1.6" fill="currentColor"/><circle cx="12" cy="12" r="1.6" fill="currentColor"/><circle cx="12" cy="18.5" r="1.6" fill="currentColor"/></symbol>
<symbol id="info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 11v5M12 8h.01"/></symbol>
<symbol id="files" viewBox="0 0 24 24"><path d="M6 3h8l4 4v14H6zM14 3v4h4"/></symbol>
<symbol id="highlighter" viewBox="0 0 24 24"><path d="m4 20 4-1 10-10-3-3L5 16zM13 7l3 3"/></symbol>
<symbol id="clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 7v5l3 2"/></symbol>
<symbol id="plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
<symbol id="star" viewBox="0 0 24 24"><path d="m12 3 2.7 5.6 6.1.8-4.5 4.2 1.1 6-5.4-3-5.4 3 1.1-6L3.2 9.4l6.1-.8z"/></symbol>
<symbol id="bookmark" viewBox="0 0 24 24"><path d="M6 3h12v18l-6-4-6 4z"/></symbol>
</defs></svg>
<nav class="switch" aria-label="Layout comparison"><strong>Litara · Title studies</strong><button type="button">Saddle stitch</button><button type="button">Midnight folio</button><button type="button">Sunday book review</button><button type="button">Circulation desk</button></nav><main></main><script>
const ic=n=>`<svg class="i"><use href="#${n}"/></svg>`;
const stars=n=>`<span class="stars" aria-label="Rated ${n} of 5">${[1,2,3,4,5].map(k=>`<svg class="i" style="${k<=n?'fill:currentColor':''}"><use href="#star"/></svg>`).join('')}</span>`;
const cvr=(t,a,h,fm=[])=>`<div class="cvwrap"><div class="cv" style="--h:${h}"><b>${t}</b><i>${a.split(' ').pop()}</i></div><div class="fm">${fm.map(f=>`<span class="tag ${f==='M4B'?'au':''}">${f}</span>`).join('')}</div><div class="more">${ic('dots')}</div></div>`;
const main=cvr('The Time Machine','H. G. Wells',210,['EPUB +','M4B']);
const syn='A Victorian scientist builds a machine that carries him through time, and he travels to the year 802,701. There he meets the gentle Eloi, who live above ground in apparent ease, and discovers the Morlocks who tend the machinery below. This edition keeps the revised 1895 text, with a short introduction and notes on the Scientific Romances series. '+'He returns with a strange flower, a few doubting friends and a story nobody believes. The book is short, bleak and still the template for most time travel since.';
const btn=(i,l,c='')=>`<a class="btn ${c}" title="${l}" aria-label="${l}">${ic(i)}${l}</a>`;
const ibtn=(i,l,c='')=>`<a class="btn ico ${c}" title="${l}" aria-label="${l}">${ic(i)}</a>`;
const acts=`${btn('book-open','Read','pri')}${btn('headphones','Listen')}${ibtn('eye','Mark as read')}${ibtn('download','Download')}${ibtn('shelf','Add to shelf')}${ibtn('send','Send to device')}${ibtn('dots','More')}`;
const status=`<a class="btn sm">${ic('bookmark')}Unread ${ic('chev-r')}</a>`;
const chipSpans=`<span class="chip">Science fiction</span><span class="chip">Classic</span><span class="chip">Scientific Romances</span>`;const chips=`<div class="chips">${chipSpans}</div>`;
const details=[['Publisher','William Heinemann'],['Published','1895'],['Language','en'],['Pages','118'],['ISBN','978-1-2345-6789-7'],['File size','1.3 MB'],['Library','Fiction'],['Added','Jun 18, 2026 '+ic('pencil')],['Date started','– '+ic('pencil')],['Date finished','– '+ic('pencil')]];
const kv=(rows,cls='kvl')=>rows.map(([k,v])=>`<div class="${cls}"><span>${k}</span><span>${v}</span></div>`).join('');
const editions=`<div class="kvl"><span><span class="tag">EPUB</span> Ebook</span><span>1.3 MB</span></div><div class="kvl"><span><span class="tag au">M4B</span> Audiobook</span><span>3h 12m</span></div><div class="kvl"><span>Files on disk</span><span>4</span></div>`;
const reading=`<p style="margin:0">No reading sessions yet. Opening this book in the reader tracks time, pace and per-device progress.</p>`;
const review=`<div class="row" style="justify-content:space-between"><span style="color:var(--dm)">Your review: not written yet</span>${btn('pencil','Write','sm')}</div>`;
const rail=(n=14)=>{const t=['The Invisible Man','The War of the Worlds','The Island of Doctor Moreau','The First Men in the Moon','Kipps','Tono-Bungay','The Food of the Gods','In the Days of the Comet','The Sleeper Awakes','Ann Veronica','The History of Mr Polly','The Wheels of Chance','Love and Mr Lewisham','The Wonderful Visit'];return `<div class="rail">${t.slice(0,n).map((x,i)=>cvr(x,'H. G. Wells',(i*41+20)%360,[i%3?'EPUB':'EPUB +'])).join('')}</div>`};
const topnav=`<a>${ic('arrow-left')}Library</a><span style="flex:1"></span>`;
const tabsTop=(on)=>[['info','Details'],['pencil','Edit metadata'],['files','Files'],['clock','Reading log'],['highlighter','Highlights']].map(([i,l],k)=>`<a class="${k===on?'on':''}">${ic(i)}${l}</a>`).join('');
const pager=`<span class="nav">14 / 202 ${ic('chev-l')}${ic('chev-r')}</span>`;

const labels=["Saddle stitch","Midnight folio","Sunday book review","Circulation desk"];
function panel(key,title,body,note=''){return '<section class="panel '+key+'"><h2>'+title+'<small>'+note+'</small></h2>'+body+'</section>'}
function show(i){
 document.body.dataset.v=i;
 const page=document.querySelector('main');
 page.className='v'+i;
 document.querySelectorAll('.switch button').forEach((b,j)=>b.setAttribute('aria-pressed',j===i));
 page.innerHTML='<div class="tools"><a>'+ic('arrow-left')+'Library</a>'+tabsTop(0)+pager+'</div><div class="layout"><header class="hero">'+main+'<div><h1>The Time Machine</h1><div class="by">H. G. Wells · Scientific Romances #1</div><div class="row">'+stars(4)+status+'<span class="tag">82% read</span></div>'+chips+'<div class="row">'+acts+'</div></div></header>'+panel('syn','Synopsis','<div class="quote">'+syn+'</div>')+panel('facts','Details',kv(details))+panel('editions','Editions',editions+btn('plus','Add audiobook','sm'),'2 files')+panel('log','Your reading',reading+btn('book-open','Start reading','sm'),'not started')+panel('rev','Your review',review)+panel('hi','Highlights','<div class="quote">“Fifteen men on the dead man’s chest”</div>','3')+'</div><section class="shelf"><h2>More by H. G. Wells</h2>'+rail(13)+'</section>';
}
document.querySelectorAll('.switch button').forEach((b,i)=>b.onclick=()=>show(i));show(0);
</script></body></html>
